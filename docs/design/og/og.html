<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Tokens copied from tailwind.config.ts so the card can't drift from
         the site. */
      :root {
        --bg: #05070c;
        --txt: #e9f0fa;
        --dim: #8d9aad;
        --dim-2: #5d6979;
        --accent: #4c6fff;
        --accent-soft: #7d95ff;
        --teal: #24d8c4;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        background: var(--bg);
        overflow: hidden;
      }
      .plate {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
      }
      /* Keeps the type legible over the glow that sits left of the orb. */
      .scrim {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          rgba(5, 7, 12, 0.94) 0%,
          rgba(5, 7, 12, 0.86) 38%,
          rgba(5, 7, 12, 0.45) 58%,
          transparent 74%
        );
      }
      /* Covers the generator's ✦ brand glyph, which sits in the gap between
         the blue core and the teal shell and can't be cropped out without
         cutting the orb. Filled with the local background colour and feathered
         so the join is invisible. */
      .patch {
        position: absolute;
        left: 1044px;
        top: 472px;
        width: 110px;
        height: 120px;
        background: radial-gradient(
          ellipse at center,
          #060a12 0%,
          #060a12 46%,
          rgba(6, 10, 18, 0) 100%
        );
      }
      .content {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 72px;
      }
      .mark {
        display: inline-flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 34px;
      }
      .mark span:first-child {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        border-radius: 14px;
        background: linear-gradient(140deg, #4c6fff, #2b3fd6);
        box-shadow: 0 6px 22px rgba(76, 111, 255, 0.34);
        font-family: "Space Grotesk", sans-serif;
        font-weight: 700;
        font-size: 16px;
        letter-spacing: -0.02em;
        color: #fff;
      }
      .mark span:last-child {
        font-family: "JetBrains Mono", monospace;
        font-size: 14px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--dim-2);
      }
      h1 {
        font-family: "Space Grotesk", sans-serif;
        font-weight: 700;
        font-size: 82px;
        line-height: 1;
        letter-spacing: -0.045em;
        color: var(--txt);
      }
      .role {
        margin-top: 20px;
        font-family: "Manrope", sans-serif;
        font-weight: 500;
        font-size: 31px;
        letter-spacing: -0.015em;
        color: var(--dim);
      }
      .rule {
        width: 132px;
        height: 2px;
        margin: 34px 0 22px;
        background: linear-gradient(90deg, var(--accent), transparent);
      }
      .stack {
        font-family: "JetBrains Mono", monospace;
        font-weight: 500;
        font-size: 17px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--accent-soft);
      }
      .foot {
        position: absolute;
        left: 72px;
        bottom: 44px;
        display: flex;
        gap: 26px;
        font-family: "JetBrains Mono", monospace;
        font-size: 14px;
        letter-spacing: 0.06em;
        color: var(--dim-2);
      }
      .foot .live {
        color: var(--teal);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="plate" src="__BG__" alt="" />
      <div class="patch"></div>
      <div class="scrim"></div>

      <div class="content">
        <div class="mark">
          <span>OD</span>
          <span>derbalajr.com</span>
        </div>
        <h1>Omar Derbala</h1>
        <div class="role">Senior Full Stack Engineer</div>
        <div class="rule"></div>
        <div class="stack">Laravel · PostgreSQL · Next.js</div>
      </div>

      <div class="foot">
        <span class="live">★ Top Rated on Upwork</span>
        <span>Cairo · Remote</span>
      </div>
    </div>
  </body>
</html>
