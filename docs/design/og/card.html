<!doctype html>
<!--
  Share card, 1200×630. Rendered by card.mjs once per language.

  Everything that matters sits in the centre 600px column: WhatsApp crops the
  card to about 1.4:1 around the centre, iMessage and some Telegram clients to
  a square, LinkedIn and X show it whole. The sides are atmosphere only.
-->
<html lang="__LANG__" dir="__DIR__">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Manrope:wght@500;600&family=JetBrains+Mono:wght@500&family=Alexandria:wght@600;700&family=IBM+Plex+Sans+Arabic:wght@500;600&display=block"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; background: #05070c; }
      body {
        --display: "Space Grotesk", sans-serif;
        --sans: "Manrope", sans-serif;
      }
      html[lang="ar"] body {
        --display: "Alexandria", "Space Grotesk", sans-serif;
        --sans: "IBM Plex Sans Arabic", "Manrope", sans-serif;
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background:
          radial-gradient(520px 420px at 50% 34%, rgba(76, 111, 255, 0.28), transparent 70%),
          radial-gradient(420px 300px at 50% 100%, rgba(36, 216, 196, 0.14), transparent 70%),
          #05070c;
        color: #e9f0fa;
      }
      /* The hero's faint grid, fading out towards the edges. */
      .grid {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(rgba(233, 240, 250, 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(233, 240, 250, 0.045) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: radial-gradient(ellipse 60% 75% at 50% 45%, #000 30%, transparent 85%);
      }
      .col {
        position: absolute;
        left: 300px;
        width: 600px;
        top: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .portrait {
        position: relative;
        width: 212px;
        height: 212px;
        border-radius: 50%;
        padding: 4px;
        background: linear-gradient(150deg, #4c6fff, #24d8c4 70%, rgba(36, 216, 196, 0.2));
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.55);
      }
      .portrait .crop {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        overflow: hidden;
        border: 4px solid #05070c;
      }
      /* The source is a 3:4 head-and-shoulders portrait; zoom in so the face,
         not the jacket, fills the circle. */
      .portrait img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 0%;
        transform: scale(1.32);
        transform-origin: 50% 30%;
        display: block;
      }
      h1 {
        margin-top: 30px;
        font-family: var(--display);
        font-weight: 700;
        font-size: 66px;
        line-height: 1.05;
        letter-spacing: -0.04em;
      }
      html[lang="ar"] h1 { letter-spacing: 0; line-height: 1.3; }
      .role {
        margin-top: 14px;
        font-family: var(--sans);
        font-weight: 600;
        font-size: 27px;
        color: #b9c6d8;
      }
      .role b { color: #7d95ff; font-weight: 600; }
      .url {
        margin-top: 22px;
        font-family: "JetBrains Mono", monospace;
        font-weight: 500;
        font-size: 17px;
        letter-spacing: 0.08em;
        color: #8d9aad;
        direction: ltr;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="grid"></div>
      <div class="col">
        <div class="portrait"><div class="crop"><img src="__PHOTO__" alt="" /></div></div>
        <h1>__NAME__</h1>
        <div class="role">__ROLE__</div>
        <div class="url">DERBALAJR.COM</div>
      </div>
    </div>
  </body>
</html>
